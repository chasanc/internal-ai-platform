# Local stand-in for a cloud load balancer: two gateway instances on :4000, two triage instances on :8000.
# Docker DNS lists every replica of a service; re-resolving every few seconds follows restarts and scaling.
# nosemgrep on the proxy_pass lines: the upstream is a fixed literal, not client input, and `internal` would make
# the location unreachable from clients.
events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 4000;
    location / {
      set $upstream http://gateway:4000;
      # nosemgrep: generic.nginx.security.missing-internal.missing-internal
      proxy_pass $upstream;
      proxy_read_timeout 120s;
    }
  }

  server {
    listen 8000;
    location / {
      set $upstream http://support-triage:8000;
      # nosemgrep: generic.nginx.security.missing-internal.missing-internal
      proxy_pass $upstream;
      proxy_read_timeout 120s;
    }
  }
}
