# Tools call these aliases, never a provider model name. Changing the model behind an alias
# is a config change that must pass `make gate` first (docs/adr/0001-model-selection.md).
# Keys come from the environment; nothing secret lives in this file.
model_list:
  - model_name: triage-default
    litellm_params: &haiku
      model: anthropic/claude-haiku-5-5  # pin a dated id in production once the provider publishes one
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30
  - model_name: triage-fallback
    litellm_params: &gptmini
      model: openai/gpt-5.4-mini-2026-03-17
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
  - model_name: drafts-default
    litellm_params: *haiku
  - model_name: drafts-fallback
    litellm_params: *gptmini
  - model_name: analysis-default
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 60
  - model_name: mock  # answers without calling any provider; for local runs and compose, costs nothing
    litellm_params:
      model: openai/mock
      mock_response: '{"category":"other","priority":"low","needs_human":true,"draft_reply":"Thanks for contacting us."}'

router_settings:
  num_retries: 1
  timeout: 30
  fallbacks:
    - triage-default: [triage-fallback]
    - drafts-default: [drafts-fallback]

litellm_settings:
  drop_params: true
  turn_off_message_logging: true  # no request or response bodies in logs or spend records
  callbacks: ["mask_hook.guard"]  # masks PII and financial ids in every request (second layer, ADR 0002)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL  # per-tool keys, budgets and spend
